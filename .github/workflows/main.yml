name: Build and Sign Extension

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build & Sign Extension
        env:
          EXTENSION_KEY: ${{ secrets.EXTENSION_KEY }}
        run: |
          if [ -n "$EXTENSION_KEY" ]; then
            printf '%s\n' "$EXTENSION_KEY" > key.pem
            dos2unix key.pem 2>/dev/null || true
          else
            openssl genrsa -out key.pem 2048
          fi
          
          npx crx3 pack . -p key.pem -o extension.crx   # Modern crx3 tool
          
          zip -r extension.zip . -x "*.git*" ".github*" "key.pem"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extension-build
          path: |
            extension.crx
            extension.zip
            key.pem
