name: Build and Sign Extension

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
      - 'V*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Zip File
        run: zip -r Bookmark.zip . -x "*.crx" -x "*.pem" -x "*.git*" -x "*.github*" -x "Bookmark.zip"

      - name: Pack CRX
        uses: cardinalby/webext-buildtools-chrome-crx-action@v2
        with:
          zipFilePath: 'Bookmark.zip'
          crxFilePath: 'Bookmark.crx'
          privateKey: ${{ secrets.EXTENSION_KEY }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signed-extension
          path: |
            Bookmark.zip
            Bookmark.crx

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Bookmark.zip
            Bookmark.crx
