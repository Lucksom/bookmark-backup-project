name: Build and Sign Extension
on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ] # Trigger release when you push a tag like v1.0

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create a release
    steps:
      - uses: actions/checkout@v4

      - name: Build Extension
        env:
          MY_KEY: ${{ secrets.EXTENSION_KEY }}
        run: |
          echo "$MY_KEY" > key.pem
          npx crx pack . -p key.pem -o extension.crx
          zip -r extension.zip . -x "*.git*" ".github*" "key.pem"
          rm key.pem

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            extension.crx
            extension.zip
          name: Release ${{ github.ref_name }}
          body: "Official build of Bookmark Cloud Backup (Legacy)"
