name: Build and Release Extension

# This triggers ONLY when you publish a new Release on GitHub
on:
  release:
    types: [published]

permissions:
  contents: write

# This silences that annoying Node 20 warning
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Zip File
        run: zip -r Bookmark.zip . -x "*.crx" -x "*.pem" -x "*.git*" -x "*.github*" -x "Bookmark.zip"

      - name: Pack CRX
        uses: cardinalby/webext-buildtools-chrome-crx-action@v2
        with:
          zipFilePath: 'Bookmark.zip'
          crxFilePath: 'Bookmark.crx'
          privateKey: ${{ secrets.EXTENSION_KEY }}

      - name: Upload Files to the Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Bookmark.zip
            Bookmark.crx
