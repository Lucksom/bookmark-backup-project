name: Build and Sign Extension
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Extension
        env:
          MY_KEY: ${{ secrets.EXTENSION_KEY }}
        run: |
          cat <<EOF > key.pem
          $MY_KEY
          EOF
          npx crx pack . -p key.pem -o extension.crx
          zip -r extension.zip . -x "*.git*" ".github*" "key.pem"
          rm key.pem

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: signed-extension
          path: |
            extension.crx
            extension.zip
