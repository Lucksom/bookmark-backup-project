name: Build and Sign Extension
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20   # or 18/22

      - name: Build Extension
        env:
          MY_KEY: ${{ secrets.EXTENSION_KEY }}
        run: |
          if [ -z "$MY_KEY" ]; then
            echo "No secret found. Generating a new private key..."
            openssl genrsa -out key.pem 2048
          else
            echo "Secret found. Fixing formatting..."
            echo "$MY_KEY" | sed 's/-----BEGIN RSA PRIVATE KEY-----//' | sed 's/-----END RSA PRIVATE KEY-----//' | tr -d '\n ' | fold -w 64 > key_body.txt
            echo "-----BEGIN RSA PRIVATE KEY-----" > key.pem
            cat key_body.txt >> key.pem
            echo "-----END RSA PRIVATE KEY-----" >> key.pem
          fi
          
          npx crx pack . -p key.pem -o extension.crx
          zip -r extension.zip . -x "*.git*" ".github*" "key.pem" "key_body.txt"

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: signed-extension
          path: |
            extension.crx
            extension.zip
            key.pem
