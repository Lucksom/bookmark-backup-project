<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="popup.css">
    <title>Bookmark Cloud</title>
</head>
<body>
    <div class="container">
        <header>
            <h1>Bookmark Cloud</h1>
            <p class="status" id="status-text">Checking status...</p>
        </header>
        
        <div class="action-grid">
            <button id="btn-login" class="material-btn primary">Login with Google</button>
            <button id="btn-backup-drive" class="material-btn" disabled>Backup to Drive</button>
            
            <hr>
            
            <select id="backup-list" class="material-btn" style="display: none; background: rgba(255,255,255,0.9); color: #1f2937; padding: 0 12px; font-size: 0.85rem; text-align: center; margin-bottom: 4px;"></select>
            
            <div id="manage-group" style="display: none; gap: 8px;">
                <button id="btn-restore-drive" class="material-btn" style="flex: 1; padding: 0;">Restore</button>
                <button id="btn-delete-drive" class="material-btn" style="flex: 1; padding: 0; background-color: #fee2e2; color: #991b1b; border: 1px solid #fca5a5;">Delete</button>
            </div>
            
            <hr>
            
            <button id="btn-export-local" class="material-btn secondary">Export Offline (.json)</button>
            <input type="file" id="file-import-local" accept=".json" style="display: none;">
            <button id="btn-import-local" class="material-btn secondary">Import Offline</button>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
